name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenSpec
        run: npm run openspec:check

      - name: Dependency audit
        # multer CVEs (GHSA-72gw-mp4g-v24j, GHSA-3p4h-7m6x-2hcm) are inside
        # @nestjs/platform-express; no file-upload surface exposed; accepted risk.
        # Only fail on critical severity to avoid blocking on accepted highs.
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ai-service:
    name: AI service lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
