version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      node-production:
        dependency-type: production
      node-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /apps/ai-service
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - devops
